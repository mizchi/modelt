name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm test:mutation
      - run: pnpm evaluate
      - run: pnpm evaluate:replay
      - run: pnpm eval:loop evals/plans/0001-longer-walk.json ci .artifacts/evals
      - run: pnpm eval:replay .artifacts/evals/ci-confirmation
      - run: pnpm eval:loop evals/plans/0002-mixed-depth.json ci-mixed .artifacts/evals
      - run: pnpm eval:replay .artifacts/evals/ci-mixed-confirmation
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: mutation-report
          path: .mutator/report
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: method-evaluation
          path: |
            .artifacts/evaluation
            .artifacts/evals
          if-no-files-found: ignore
