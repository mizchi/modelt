name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CI: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: rustup target add wasm32-unknown-unknown
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo fmt --manifest-path crates/modelt-core/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path crates/modelt-core/Cargo.toml -- -D warnings
      - run: pnpm portable:build
      - run: pnpm portable:test
      - run: pnpm usable:test
      - run: pnpm runtime:build
      - run: pnpm runtime:test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm portable:browser
      - run: pnpm runtime:browser
      - run: pnpm test:mutation
      - run: pnpm evaluate
      - run: pnpm evaluate:replay
      - run: pnpm eval:loop evals/plans/0002-mixed-depth.json ci-mixed .artifacts/evals
      - run: pnpm eval:replay .artifacts/evals/ci-mixed-confirmation
      - run: node dist/scripts/package.js
      - run: pnpm package:test
      - run: pnpm usable:eval .artifacts/usable-evaluation
      - run: pnpm usable:replay .artifacts/usable-evaluation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: verification-evidence
          path: |
            .mutator/report
            .artifacts/evaluation
            .artifacts/evals
            .artifacts/usable-evaluation
            .artifacts/packages
          if-no-files-found: warn
