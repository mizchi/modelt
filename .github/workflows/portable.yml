name: Portable core
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo fmt --manifest-path crates/modelt-core/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path crates/modelt-core/Cargo.toml -- -D warnings
      - run: pnpm portable:build
      - run: pnpm portable:test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm portable:browser
      - run: pnpm portable:eval .artifacts/portable-evaluation
      - run: node dist/evals/portable/replay.js .artifacts/portable-evaluation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: portable-core-evaluation
          path: .artifacts/portable-evaluation
          if-no-files-found: error
