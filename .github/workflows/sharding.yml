name: Sharded model checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shards-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: node dist/evals/runtime/shard-cli.js prepare .artifacts/cloud/manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: task-manifest
          path: .artifacts/cloud/manifest.json
          if-no-files-found: error
  shard:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: task-manifest
          path: .artifacts/cloud
      - run: node dist/evals/runtime/shard-cli.js run .artifacts/cloud/manifest.json ${{ matrix.shard }} 4 .artifacts/shard-${{ matrix.shard }} 1 5000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: shard-${{ matrix.shard }}
          path: .artifacts/shard-${{ matrix.shard }}
          if-no-files-found: error
  merge:
    needs: [prepare, shard]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: task-manifest
          path: .artifacts/cloud
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shard-*
          path: .artifacts/shards
      - run: node dist/evals/runtime/shard-cli.js merge-directory .artifacts/cloud/manifest.json .artifacts/merged.json .artifacts/shards
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: merged-model-checks
          path: .artifacts/merged.json
          if-no-files-found: error
